[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    # An unregistered marker is a collection error.
    --strict-markers
    # A misspelled key in THIS file is an error rather than a silently
    # ignored setting -- the same defect class as the [tool:pytest] header
    # that made every setting below inert (DW-102).
    --strict-config
    --disable-warnings
markers =
    unit: Unit tests (using SQLite in-memory database)
    integration: Integration tests (using MariaDB test database)
    e2e: End-to-end tests (using full application stack)
    slow: Slow running tests
    screenshot: Screenshot generation tests for documentation
# Setting this key REPLACES pytest's built-in default list rather than adding
# to it, so the default is repeated verbatim here:
#     *.egg .* _darcs build CVS dist node_modules venv {arch}
# Dropping the ``.*`` glob in particular would expose .nox/ (whose session
# virtualenvs ship a few hundred third-party test_*.py files) and
# .claude/skills/**/scripts/tests/ to any run that recurses from the repo
# root, i.e. `pytest .`. Because testpaths
# confines every nox session to tests/, nothing recurses from the root today --
# this is defence in depth, not load-bearing. Note it does not filter a
# directory named directly on the command line: `pytest .nox` still collects.
# Project extras appended below: *.egg-info, __pycache__, migrations.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} *.egg-info __pycache__ migrations
minversion = 7.0
