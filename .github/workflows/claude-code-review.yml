name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Without these the log shows only "init" and "result" — 2+ minutes of
          # invisible work and a bare permission_denials_count when it goes wrong.
          display_report: true
          show_full_output: true
          # An enumerated command allowlist starves the review: the plugin fans out
          # ~10 subagents that inherit it, and each reach for sed/awk/jq/diff, none of
          # which were listed. The job is contents:read on a single-user repo with no
          # forks, so allow Bash outright rather than chase the list.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Task,TodoWrite,Bash"
