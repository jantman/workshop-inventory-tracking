# Release Workflow for workshop-inventory-tracking
#
# Creates a release when the version in pyproject.toml is greater than the
# latest GitHub release. Bump `version` in pyproject.toml and merge to main to
# cut a release; nothing happens if the version is unchanged.
#
# Requires "Read and write permissions" under repository
# Settings -> Actions -> General -> Workflow permissions, so the workflow can
# create releases and push to ghcr.io.

name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Get current version
        id: current
        run: |
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest release version
        id: latest
        run: |
          LATEST=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "0.0.0")
          # Remove 'v' prefix if present
          LATEST=${LATEST#v}
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if should release
        id: check
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          echo "Current version: $CURRENT"
          echo "Latest release: $LATEST"

          # Compare with version sort: if current is greater, it sorts last
          HIGHER=$(printf '%s\n%s' "$LATEST" "$CURRENT" | sort -V | tail -n1)

          if [ "$HIGHER" = "$CURRENT" ] && [ "$CURRENT" != "$LATEST" ]; then
            SHOULD_RELEASE="true"
          else
            SHOULD_RELEASE="false"
          fi

          echo "Should release: $SHOULD_RELEASE"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # IMPORTANT: Keep the Docker build configuration in sync with test.yml.
      # When updating these steps, also update the docker-build job there.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase, but ${{ github.repository }}
      # preserves the owner's case. Lowercase it for use in image tags.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=workshop-inventory-tracking
            org.opencontainers.image.description=Flask web application for tracking materials and supplies in a hobby workshop
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            com.github.actions.workflow=${{ github.workflow }}
            com.github.actions.run-id=${{ github.run_id }}
            com.github.actions.run-number=${{ github.run_number }}
            com.github.actions.run-attempt=${{ github.run_attempt }}
            com.github.actions.run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.check-version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker Image

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ needs.check-version.outputs.version }}
            ```

            Or use the latest tag:
            ```bash
            docker pull ${{ steps.image.outputs.name }}:latest
            ```

            Database migrations are not run automatically. Before starting the
            new image, run:
            ```bash
            docker run --rm --env-file .env ${{ steps.image.outputs.name }}:${{ needs.check-version.outputs.version }} python manage.py db upgrade
            ```

            See the [Docker image on GitHub Packages](https://github.com/${{ github.repository }}/pkgs/container/workshop-inventory-tracking).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
