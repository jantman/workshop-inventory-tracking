name: Claude PR Review

# Proactive: reviews every PR without being asked. Pairs with
# claude-mention.yml, which is the reactive half — see the README in this
# directory for why both exist before deleting either as a "duplicate".

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Step 1 of the plugin's command stops silently if Claude has already
          # commented on the PR, which would make every `synchronize` run a no-op
          # after the first review. The trailing paragraphs override that; they
          # reach the model as command arguments.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Override to step 1: do NOT stop because Claude has already commented on
            this pull request. Earlier Claude reviews are expected here and are not a
            reason to skip. The other step 1 stop conditions (closed, draft, trivial)
            still apply.

            If Claude has commented before, scope this review to the commits pushed
            since Claude's most recent review comment rather than the whole PR diff,
            and do not re-raise an issue that a previous comment already covers.
          # Without these the log shows only "init" and "result" — 2+ minutes of
          # invisible work and a bare permission_denials_count when it goes wrong.
          display_report: true
          show_full_output: true
          # An enumerated command allowlist starves the review: the plugin fans out
          # ~10 subagents that inherit it, and each reach for sed/awk/jq/diff, none of
          # which were listed. The job is contents:read on a single-user repo with no
          # forks, so allow Bash outright rather than chase the list.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Task,TodoWrite,Bash"

      # The action writes its transcript under the runner temp dir and throws it
      # away with the runner. Without this there is no way to find out why a run
      # posted nothing.
      - name: Collect Claude logs
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/claude-logs"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            cp "$EXECUTION_FILE" "$RUNNER_TEMP/claude-logs/execution-output.json"
          fi
          if [ -d "$HOME/.claude/projects" ]; then
            cp -r "$HOME/.claude/projects" "$RUNNER_TEMP/claude-logs/sessions"
          fi
          find "$RUNNER_TEMP/claude-logs" -type f -printf '%s\t%p\n' | sort -rn

      - name: Upload Claude logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-pr-review-logs-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-logs/
          if-no-files-found: warn
          retention-days: 14
