name: Claude (@mention)

# Reactive: does nothing until someone writes @claude. Pairs with
# claude-pr-review.yml, which is the proactive half — see the README in this
# directory for why both exist before deleting either as a "duplicate".
#
# NOTE: issue_comment workflows always run from the default branch, so edits to
# this file do nothing until they are on main.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Without these the log shows only "init" and "result" — no way to see
          # what Claude actually did or which tool calls were refused.
          display_report: true
          show_full_output: true

          # Enumerating commands starves the agent: it reaches for sed/awk/jq/diff
          # constantly and every unlisted one is a silent denial. Single-user repo,
          # no forks, so allow Bash outright rather than chase the list.
          claude_args: |
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,Task,TodoWrite,WebSearch,WebFetch"

      # The action writes its transcript under the runner temp dir and throws it
      # away with the runner. Without this there is no way to find out why a run
      # did nothing visible.
      - name: Collect Claude logs
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/claude-logs"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            cp "$EXECUTION_FILE" "$RUNNER_TEMP/claude-logs/execution-output.json"
          fi
          if [ -d "$HOME/.claude/projects" ]; then
            cp -r "$HOME/.claude/projects" "$RUNNER_TEMP/claude-logs/sessions"
          fi
          find "$RUNNER_TEMP/claude-logs" -type f -printf '%s\t%p\n' | sort -rn

      - name: Upload Claude logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-mention-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-logs/
          if-no-files-found: warn
          retention-days: 14
