<!DOCTYPE html>
<!--
  A hand-written stand-in for a McMaster-Carr product detail page, transcribed
  from https://www.mcmaster.com/91290A115/ on 2026-08-25. Same convention as
  amazon_listing.html and mcmaster_order.html.

  A product page carries no personal data, so the scrubbing that shaped the
  order fixture does not apply here. What shaped this one is the opposite
  problem from the order page:

  * **Every class name here is CSS-module hashed** -- `_price_1y02s_5`,
    `_partNumber_rhz5b_5`, `_unitOfMeasure_hsst6_7`. The trailing hash is a
    build artifact and will change without warning; the readable stem will not.
    So the product reader matches on the stem (`[class*="_partNumber_"]`) and
    never on the whole class. The hashes below are the real ones as of the
    transcription date, kept so the fixture exercises substring matching rather
    than assuming it.

    This is the reverse of the order page, whose card view uses plain unhashed
    names. The two readers key on different things because the two pages *are*
    different, not through inconsistency.

  * **The price and the pack size are one string**: `_price_` reads
    "$13.23 per pack of 100". `_unitOfMeasure_` states the pack again as
    "Pack of 100". Either can yield the pack size; the price only comes from
    the first.

  * The description is split across two headers -- `h1._productDetailHeaderPrimary_`
    ("Black-Oxide Alloy Steel Socket Head Screw") and
    `h3._productDetailHeaderSecondary_` ("M3 x 0.5 mm Thread Size, 10 mm Long").
    Joined with ", " they reproduce `document.title` minus the " | McMaster-Carr"
    suffix, which is what the listing title should be.

  * **No manufacturer is named anywhere on the page.** McMaster sells to its own
    specification. `brand` comes back empty and that is a fact about the vendor,
    not a missed selector -- which is why FR-012 writes an MPN only where a page
    actually states one, and this page does not.

  * The specification table nests: a group row ("Thread") carries an empty value
    and is followed by `-row-indented_` rows for its members ("Size", "Spacing",
    "Pitch"). Label text is in `_..-spec-row-label_ > span`; value text is in
    `_..-spec-row-value_ > p._Prsnttn_ValCell_Paragraph_`. An explanation-icon
    div sits inside some labels and must not become part of the label text.

  * Product images live under two paths -- `/mvD/Contents/gfx/ImageCache/...` for
    photographs and `/mvD/Library/CAD2/...` for line drawings -- and carry the
    part number in the filename. The page also holds ~40 catalog-navigation
    icons under `/init/gfx/`, which are chrome and must not be captured as
    product images. `__IMAGE_HOST__` is replaced by the test with the local
    image server, as it is in the Amazon fixtures.

  Note the path this is served at: `/91290A115/`. Two other McMaster URL shapes
  reach a part and neither is this page -- `/catalog/<part>` redirects to
  `/products/<part-lowercased>/`, which is a filterable *family table* listing
  many part numbers rather than one product. The dispatch matches this shape
  only, deliberately. research.md §5.
-->
